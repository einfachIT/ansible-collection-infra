---

- name: Install prerequisites
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - rsync
    - dnsmasq
    - tcpdump
    - nfs-kernel-server

- name: Create piaas directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ piaas_nfs_root }}"
    - "{{ piaas_nfs_root }}/upper"
    - "{{ piaas_nfs_root }}/work"
    - "{{ piaas_tftp_root }}"
    - "{{ piaas_images_root }}"
    - "{{ piaas_config_root }}"
    - "{{ piaas_config_root }}/nodes"


- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Configure dnsmasq
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.conf
    regexp: "{{ item.regexp }}" 
    line: "{{ item.line }}"
  loop:
    - regexp: "^dhcp-range="
      line: "dhcp-range={{ piaas_dhcp_range }}"
    - regexp: "^log-dhcp"
      line: "log-dhcp"
    - regexp: "^enable-tftp"
      line: "enable-tftp"
    - regexp: "^tftp-root="
      line: "tftp-root={{ piaas_tftp_root }}"
    - regexp: "^pxe-service="
      line: 'pxe-service=0,"Raspberry Pi Boot"'
  notify:
    - Setup dnsmasq service

- name: Configure nfs root exports
  ansible.builtin.lineinfile:
    dest: /etc/exports
    line: "{{ item }}"
  loop:
    - "{{ piaas_nfs_root }} *(rw,sync,no_root_squash,crossmnt,no_subtree_check)"
  notify:
   - Restart rpcbind
   - Restart nfs server


- name: Ensure /etc/exports.d exists
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    mode: '0755'

- name: Ensure source exports file exists (optional safeguard)
  ansible.builtin.file:
    path: /data/config/piaas.exports
    state: touch
    access_time: preserve
    modification_time: preserve
    mode: '0644'

- name: Create symlink in /etc/exports.d
  ansible.builtin.file:
    src: /data/config/piaas.exports
    dest: /etc/exports.d/piaas.exports
    state: link
  notify:
   - Restart rpcbind
   - Restart nfs server

- name: Copy bootcode.bin
  ansible.builtin.copy:
    src: "/boot/firmware/bootcode.bin"
    dest: "{{ piaas_tftp_root }}/"
    remote_src: true

- name: Copy clout-init config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ piaas_config_root }}/"
    mode: 0644
  loop:
    - custom.toml
    - meta-data
    - user-data
    - network-config

- name: copy vnc script
  ansible.builtin.copy:
    src: "enable_vnc_access.sh"
    dest: "{{ piaas_config_root }}/"
    mode: 0744
