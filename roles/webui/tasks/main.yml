---

- name: Install needed packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - rsync
    - mini-httpd
    - snmp
    - nmap

- name: configure mini-httpd
  ansible.builtin.lineinfile:
    dest: /etc/mini-httpd.conf
    regexp: "{{ item.exp }}"
    line: "{{ item.value }}"
  loop:
    - exp: "^host"
      value: "host=0.0.0.0"
    - exp: "^user"
      value: "user={{ piaas_user }}"
    - exp: "^port"
      value: "port={{ piaas_port }}"
  notify:
    - Restart mini-httpd

- name: Create initial empty piaas fstab
  ansible.builtin.copy:
    dest: "{{ piaas_config_root }}/fstab"
    owner: root
    group: root
    force: false
    mode: "0644"
    content: '# mount configuration for the piaas'

- name: Copy cli scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/sbin/{{ item }}"
    owner: root
    group: root
    mode: '0744'
  loop:
    - piaas_image
    - piaas_instance

- name: Install piaas custom mount service
  ansible.builtin.template:
    src: "piaas-fstab.service.j2"
    dest: "/etc/systemd/system/piaas-fstab.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    Start piaas mount service

- name: Create local data directory for Redis container persistence
  ansible.builtin.file:
    path: "{{ webui_redis_data_dir }}"
    state: directory
    mode: '0755'
  when: webui_redis_enabled

- name: Deploy Redis Docker Container
  community.docker.docker_container:
    name: "{{ webui_redis_container_name }}"
    image: "{{ webui_redis_image }}"
    state: started
    restart_policy: always
    # Bind only to 127.0.0.1 on the host to keep Redis traffic hidden from external networks
    published_ports:
      - "127.0.0.1:{{ webui_redis_port }}:6379"
    volumes:
      - "{{ webui_redis_data_dir }}:/data"
    command: "redis-server --appendonly yes" # Enables persistent storage tracking
  when: webui_redis_enabledA

- name: Deploy Traefik Route Manager Container
  community.docker.docker_container:
    name: "{{ webui_trm_container_name }}"
    image: "{{ webui_trm_image }}"
    state: started
    restart_policy: always
    published_ports:
      - "127.0.0.1:{{ webui_trm_port }}:8080" # Maps local host port to internal app port
    env:
      AUTH_TOKEN: "{{ webui_trm_auth_token }}" # Explicit security token requirement
    volumes:
      # Mounts the exact host dynamic folder into the container's watch zone
      - "{{ webui_traefik_dynamic_dir }}:/app/config" 
  when: webui_trm_enabled
 
- name: copy traeffic configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ piaas_user }}/{{ item }}.yml"
    owner: root
    group: root
    mode: '0644'
    force: true
  loop:
   - traefik
  notify:
    - Restart traefik

- name: Create traeffic certs docker volume
  community.docker.docker_volume:
    name: traefik_certs

- name: Install traefik container
  community.general.docker_container:
    name: "traefik"
    image: "traefik:latest"
    restart_policy: "unless-stopped"
    published_ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/home/{{ piaas_user }}/traefik.yml:/etc/traefik/traefik.yml"
      - "/home/{{ piaas_user }}/dynamic.yml:/etc/traefik/dynamic.yml"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "traefik_certs:/certs"

- name: Create guacamole config docker volume
  community.docker.docker_volume:
    name: guac_config

- name: Install guacamole with docker
  community.docker.docker_container:
    name: guacamole
    image: flcontainers/guacamole
    restart_policy: unless-stopped
    volumes:
      - guac_config:/config
    env:
      EXTENSIONS: "auth-quickconnect,auth-openid"
    labels:
      traefik.enable: "true"
      traefik.http.routers.guacamole.rule: "Host(`guacamole.{{ piaas_external_fqdn }}`)"
      traefik.http.routers.guacamole.entrypoints: "websecure"
      traefik.http.routers.guacamole.tls: "true"
      traefik.http.routers.guacamole.tls.certresolver: "epicresolver"
      traefik.http.routers.guacamole.service: "guacamoleService"
      traefik.http.services.guacamoleService.loadBalancer.server.port: "8080"

- name: Create cgi-bin directory
  ansible.builtin.file:
    path: "/var/www/html/cgi-bin"
    state: directory
    mode: '0755'

- name: copy web-ui prototype script
  ansible.builtin.template:
    src: "{{ item.src}}" 
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    owner: epic
    group: epic
    force: true
  loop:
   - src: index.html
     dest: /var/www/html/
     mode: '0644'
   - src: piaas.cgi.j2
     dest: /var/www/html/cgi-bin/piaas.cgi
     mode: '0755'

- name: copy node info files
  ansible.builtin.template:
    src: "nodes.j2"
    dest: "{{ piaas_config_root }}/nodes/{{ node.webui_serial }}"
  loop: "{{ piaas_nodes }}"
  loop_control:
    loop_var: node
  when:
    - piaas_nodes is defined
    - piaas_nodes | length > 0


